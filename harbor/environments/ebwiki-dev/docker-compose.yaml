# Sidecars for Harbor. Harbor reserves `main` and merges this file
# on top of its base compose. Versions match repo compose.yaml.
#
# Harbor allowlist sets network_mode=service:<egress-sidecar> on every
# service that does not declare networks/network_mode. Postgres and Redis
# must stay on the compose network (and keep their own ports), so they
# declare `networks: [default]`. Only `main` goes through the sidecar.
services:
  main:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgres://blackops:ebwiki@postgres:5432/blackops_test
      REDIS_URL: redis://redis:6379/0
      BLACKOPS_DATABASE_PASSWORD: ebwiki
      PGHOST: postgres
      PGUSER: blackops
      BUNDLE_IGNORE_FUNDING_REQUESTS: "1"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: blackops
      POSTGRES_PASSWORD: ebwiki
      POSTGRES_DB: blackops_test
    networks:
      - default
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackops -d blackops_test"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7-alpine
    networks:
      - default
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s
