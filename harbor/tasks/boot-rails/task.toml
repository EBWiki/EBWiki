schema_version = "1.3"

[task]
name = "ebwiki/boot-rails"
authors = [{ name = "EBWiki" }]
description = "Boot Rails against Harbor Compose Postgres and print the application class."

[metadata]
category = "development"
tags = ["boot", "rails", "postgres"]
difficulty_explanation = "Oracle runs rails runner after db:prepare. No paid model."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 300.0

[environment]
workdir = "/usr/src/ebwiki"
cpus = 2
memory_mb = 4096
build_timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = [
  "rubygems.org",
  "index.rubygems.org",
  "rubygems.global.ssl.fastly.net",
  "github.com",
  "objects.githubusercontent.com",
  "codeload.github.com",
]
