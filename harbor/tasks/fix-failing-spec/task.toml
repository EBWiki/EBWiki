schema_version = "1.3"

[task]
name = "ebwiki/fix-failing-spec"
authors = [{ name = "EBWiki" }]
description = "Fix HarborAddition so the introduced RSpec example is green."

[metadata]
category = "development"
tags = ["rspec", "rails"]
difficulty_explanation = "Oracle overwrites the broken PORO. First real development task."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
workdir = "/usr/src/ebwiki"
cpus = 2
memory_mb = 4096
build_timeout_sec = 900.0
# Harbor allowlist (gost RED) RST's raw Postgres/Redis TCP even when
# those hostnames and RFC1918 CIDRs are listed. Compose DB tasks stay
# on public; image-only tasks can still use allowlist.
network_mode = "public"
