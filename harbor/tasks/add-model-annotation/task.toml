schema_version = "1.3"

[task]
name = "ebwiki/add-model-annotation"
authors = [{ name = "EBWiki" }]
description = "Contributor chore stub: migration plus annotaterb comments on a Harbor-only model."

[metadata]
category = "development"
tags = ["annotate", "migration", "rails"]
difficulty_explanation = "Oracle runs annotaterb after setup applies a tiny migration. Stub — not wired in CI smoke yet."

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
workdir = "/usr/src/ebwiki"
cpus = 2
memory_mb = 4096
build_timeout_sec = 900.0
# Harbor allowlist (gost RED) RST's raw Postgres/Redis TCP even when
# those hostnames and RFC1918 CIDRs are listed. Compose DB tasks stay
# on public; image-only tasks can still use allowlist.
network_mode = "public"

[solution]
env = { RAILS_ENV = "test", DATABASE_URL = "postgres://blackops:ebwiki@postgres:5432/blackops_test", PGHOST = "postgres", PGUSER = "blackops", PGPASSWORD = "ebwiki", PGDATABASE = "blackops_test" }
