# Railway config for the ebwiki staging service only (GKT-462).
# Other Railway services in this repo keep using railway.toml unchanged.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
preDeployCommand = ["doppler", "run", "--project", "ebwiki", "--config", "stg", "--", "bash", "release-tasks.sh"]
startCommand = "doppler run --project ebwiki --config stg -- bundle exec puma -C config/puma.rb"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
