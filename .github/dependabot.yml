version: 2

updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 4
    labels:
      - "dependencies"
      - "ruby"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      bundler-security:
        applies-to: security-updates
        patterns:
          - "*"
      bundler-runtime:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"
      bundler-dev:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-runtime:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"
      npm-dev:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github_actions"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions-routine:
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"
