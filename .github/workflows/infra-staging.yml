name: Infra (staging)

on:
  pull_request:
    paths:
      - 'infra/staging/**'
      - '.github/workflows/infra-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init (no backend)
        run: tofu init -backend=false

      - name: Validate
        env:
          TOFU_STATE_PASSPHRASE: ci-validate-only
        run: tofu validate

      - name: Plan
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TOFU_STATE_PASSPHRASE: ${{ secrets.TOFU_STATE_PASSPHRASE }}
        run: |
          if [ -z "${DOPPLER_TOKEN:-}" ] || [ -z "${RAILWAY_TOKEN:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Skipping tofu plan: DOPPLER_TOKEN, RAILWAY_TOKEN, or CLOUDFLARE_API_TOKEN is not set."
            exit 0
          fi
          if [ -z "${TF_VAR_cloudflare_zone_id:-}" ]; then
            echo "Skipping tofu plan: CLOUDFLARE_ZONE_ID GitHub variable is not set."
            exit 0
          fi
          if [ -z "${TOFU_STATE_PASSPHRASE:-}" ]; then
            echo "Skipping tofu plan: TOFU_STATE_PASSPHRASE is not set (needed for encrypted remote state init)."
            exit 0
          fi
          tofu init -backend=false
          tofu plan -input=false
