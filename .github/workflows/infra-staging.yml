name: Infra (staging)

on:
  pull_request:
    paths:
      - 'infra/staging/**'
      - 'Dockerfile.railway'
      - 'railway.toml'
      - '.github/workflows/infra-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v3.7.0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1.0.0
        with:
          tofu_version: 1.13.1

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init (no backend)
        run: tofu init -backend=false

      - name: Validate
        env:
          TF_VAR_state_passphrase: ci-validate-only-passphrase
          TF_VAR_cloudflare_dns_api_token: ci-validate-only
          TF_VAR_cloudflare_zone_id: "00000000000000000000000000000000"
          TF_VAR_cloudflare_staging_dns_record_id: "00000000000000000000000000000000"
          TF_VAR_railway_project_id: "00000000-0000-0000-0000-000000000000"
          TF_VAR_railway_service_id: "00000000-0000-0000-0000-000000000000"
          TF_VAR_railway_service_domain_fqdn: "placeholder.up.railway.app"
        run: tofu validate

  opentofu-plan-dns:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: infra-staging-plan
    defaults:
      run:
        working-directory: infra/staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v3.7.0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1.0.0
        with:
          tofu_version: 1.13.1

      - name: Plan (Cloudflare DNS read only)
        env:
          TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
          TF_VAR_cloudflare_dns_api_token: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_staging_dns_record_id: ${{ vars.TF_VAR_cloudflare_staging_dns_record_id }}
          TF_VAR_railway_project_id: ${{ vars.TF_VAR_railway_project_id }}
          TF_VAR_railway_service_id: ${{ vars.TF_VAR_railway_service_id }}
          TF_VAR_railway_service_domain_fqdn: ${{ vars.TF_VAR_railway_service_domain_fqdn }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${TF_VAR_cloudflare_dns_api_token:-}" ]; then
            echo "Skipping plan: CLOUDFLARE_DNS_API_TOKEN is not set."
            exit 0
          fi
          if [ ! -f backend.hcl ]; then
            echo "Skipping plan: backend.hcl is not on the runner (copy from Doppler ebwiki/infra)."
            exit 0
          fi
          tofu init -backend-config=backend.hcl
          tofu plan -lock=false -input=false -target=cloudflare_dns_record.staging -target=cloudflare_dns_record.staging_railway_verify
