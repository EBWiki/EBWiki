name: Infra (staging)

on:
  pull_request:
    paths:
      - 'infra/staging/**'
      - 'scripts/lib/**'
      - 'scripts/staging-*.sh'
      - 'scripts/lib/infra-railway-config.sh'
      - 'scripts/lib/infra-staging-plan-gate.sh'
      - '.railway/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/infra-with-tf-vars.sh'
      - 'scripts/test/infra-lib-test.sh'
      - 'scripts/test/infra-railway-config-test.sh'
      - 'scripts/test/fixtures/**'
      - 'scripts/test/infra-doppler-names-test.sh'
      - 'Dockerfile.railway'
      - 'railway.toml'
      - '.github/workflows/infra-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opentofu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: infra/staging

    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Infra helper tests
        working-directory: .
        run: ./scripts/test/infra-lib-test.sh

      - name: Railway config plan gate tests
        working-directory: .
        run: ./scripts/test/infra-railway-config-test.sh

      - name: Staging OpenTofu plan gate tests
        working-directory: .
        run: ./scripts/test/infra-staging-plan-gate-test.sh

      - name: Doppler secret name lint
        working-directory: .
        run: ./scripts/test/infra-doppler-names-test.sh

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: 1.13.1

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init (no backend)
        run: tofu init -backend=false

      - name: Validate
        env:
          TF_VAR_state_passphrase: ci-validate-only-passphrase
          TF_VAR_cloudflare_dns_api_token: ci-validate-only
          TF_VAR_cloudflare_zone_id: "00000000000000000000000000000000"
          TF_VAR_cloudflare_staging_dns_record_id: "00000000000000000000000000000000"
          TF_VAR_railway_project_id: "00000000-0000-0000-0000-000000000000"
          TF_VAR_railway_service_id: "00000000-0000-0000-0000-000000000000"
          TF_VAR_railway_service_domain_fqdn: "placeholder.up.railway.app"
          TF_VAR_staging_basic_auth_username: ci-validate-only
          TF_VAR_staging_runtime_doppler_token: ci-validate-only
        run: tofu validate
