name: Infra (staging apply)

# Apply is intentionally manual. This workflow is a gated reminder on main only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: infra-staging-apply
    defaults:
      run:
        working-directory: infra/staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Operator apply (local)
        run: |
          echo "OpenTofu apply is not run in GitHub Actions."
          echo "After merge, Mark (or infra operator) runs tofu apply locally with:"
          echo "  DOPPLER_TOKEN, RAILWAY_TOKEN, CLOUDFLARE_API_TOKEN, TOFU_STATE_PASSPHRASE"
          echo "  backend.hcl for S3 state (see infra/staging/README.md)"
          echo "Order: Doppler secrets, Railway service/domain, Cloudflare DNS."
