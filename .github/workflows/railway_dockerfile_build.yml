---
name: Railway Dockerfile build

on:
  pull_request:
    paths:
      - Dockerfile.railway
      - railway.toml
      - config/database.railway.yml
      - Gemfile
      - Gemfile.lock
      - .github/workflows/railway_dockerfile_build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Build Dockerfile.railway (no push)
        run: docker build -f Dockerfile.railway .
