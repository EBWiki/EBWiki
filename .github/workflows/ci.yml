---
name: CI

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      BUNDLE_IGNORE_FUNDING_REQUESTS: 1

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis

    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: install dependencies
        run: |
          sudo apt-get update && sudo apt-get install libcurl4-gnutls-dev

      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: 3.4.2

      - name: Install gems
        run: bundle install

      - name: Setup database
        run: |
          cp config/database.ci.yml config/database.yml
          bundle exec bin/rails db:prepare

      - name: Run RSpec
        run: |
          bundle exec rspec spec/

  brakeman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: install dependencies
        run: |
          sudo apt-get update && sudo apt-get install libcurl4-gnutls-dev
      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: 3.4.2
          cache-version: 1

      - name: Install gems
        run: bundle install

      - name: Run Brakeman
        run: |
          bundle exec brakeman -A --no-pager --no-exit-on-warn --no-exit-on-error

  markdown-link-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Run Markdown Link Check
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          config-file: './.github/workflows/markdown_config.json'
          use-verbose-mode: 'yes'
          base-branch: main

  rubocop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: install dependencies
        run: |
          sudo apt-get update

      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: 3.4.2

      - name: Install gems
        run: bundle install

      - name: Run Rubocop
        run: bundle exec rubocop

      - name: Zeitwerk check
        env:
          RAILS_ENV: test
        run: |
          cp config/database.ci.yml config/database.yml
          bundle exec bin/rails zeitwerk:check
