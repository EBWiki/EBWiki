---
name: CI

on: [pull_request, workflow_dispatch]

jobs:
  rspec:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      BUNDLE_IGNORE_FUNDING_REQUESTS: 1
      REDIS_URL: redis://127.0.0.1:6379/1

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis
        ports:
          - 6379:6379

      elasticsearch:
        image: elasticsearch:6.8.13

    steps:
      - name: Checkout code
        uses: actions/checkout@v3.7.0

      - name: install dependencies
        run: |
          sudo apt-get update && sudo apt-get install libcurl4-gnutls-dev

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.2

      - name: Install gems
        run: bundle install

      - name: Setup database
        run: |
          cp config/database.ci.yml config/database.yml
          bundle exec bin/rails db:prepare

      - name: Run RSpec
        run: |
          bundle exec rspec spec/

  brakeman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3.7.0

      - name: install dependencies
        run: |
          sudo apt-get update && sudo apt-get install libcurl4-gnutls-dev
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.2
          cache-version: 1

      - name: Install gems
        run: bundle install

      - name: Run Brakeman (blocking baseline gate)
        run: |
          bundle exec ruby -e "require './lib/ebwiki/brakeman_gate'; Ebwiki::BrakemanGate.verify_repo!(repo_root: Dir.pwd)"

  pr-style-security-disclosure:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3.7.0
        with:
          fetch-depth: 0

      - name: Verify Style/security rule changes section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ruby script/check_pr_style_security_disclosure.rb

  markdown-link-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Run Markdown Link Check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: './.github/workflows/markdown_config.json'
          use-verbose-mode: 'yes'
          base-branch: main

  rubocop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3.7.0

      - name: install dependencies
        run: |
          sudo apt-get update

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.2

      - name: Install gems
        run: bundle install

      - name: Run Rubocop
        run: bundle exec rubocop

      - name: Pre-commit hook unit specs
        run: cd spec/pre_commit && bundle exec rspec .
