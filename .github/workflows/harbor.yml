name: Harbor tasks

on:
  pull_request:
    paths:
      - "harbor/**"
      - ".github/workflows/harbor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-tasks:
    name: Check Harbor task layout (oracle-only, no paid models)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.7.0

      - name: Validate task directories and registry.json
        run: python3 harbor/bin/check-tasks

  smoke-rails-version:
    name: Oracle smoke (smoke-rails-version, Hub image, no secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.7.0

      - name: Install Harbor CLI
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Pin CLI so CI does not drift on PyPI releases (GKT-673).
          uv tool install "harbor==0.24.0"

      - name: Run oracle smoke task
        run: |
          set -euo pipefail
          OUTPUT="$(harbor run \
            --path harbor/tasks \
            --include-task-name smoke-rails-version \
            --agent oracle \
            --env docker \
            --yes 2>&1)"
          printf '%s\n' "$OUTPUT"
          REWARD="$(printf '%s\n' "$OUTPUT" | grep -oP 'Mean:\s+\K[0-9.]+' | tail -1 || true)"
          if [ -z "$REWARD" ] || ! awk -v r="$REWARD" 'BEGIN { exit (r + 0 >= 1.0) ? 0 : 1 }'; then
            echo "Oracle smoke failed: mean=${REWARD:-unknown}"
            exit 1
          fi
          echo "Oracle smoke passed (mean=$REWARD)"
