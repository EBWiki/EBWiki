---
name: Release smoke check

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to smoke test
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  smoke_check:
    if: github.ref == 'refs/heads/main'
    environment: release-smoke
    runs-on: ubuntu-latest

    env:
      BUNDLE_IGNORE_FUNDING_REQUESTS: 1
      RELEASE_SMOKE_BASE_URL: >-
        ${{
          github.event.inputs.target == 'production' && 'https://ebwiki.org' || 'https://staging.ebwiki.org'
        }}
      RELEASE_SMOKE_ALLOWED_HOSTS: staging.ebwiki.org,ebwiki.org

    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: 3.4.2

      - name: Install gems
        run: bundle install

      - name: Run post-deploy smoke check
        env:
          STAGING_USERNAME: ${{ (github.event.inputs.target == 'staging') && secrets.STAGING_USERNAME || '' }}
          STAGING_PASSWORD: ${{ (github.event.inputs.target == 'staging') && secrets.STAGING_PASSWORD || '' }}
          RELEASE_SMOKE_SEARCH_TERM: ${{ vars.RELEASE_SMOKE_SEARCH_TERM }}
          ROLLBAR_ACCESS_TOKEN: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          ROLLBAR_ENV: ${{ github.event.inputs.target }}
        run: bundle exec bin/release-smoke-check
